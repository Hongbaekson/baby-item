name: Refresh and publish sale data

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-sale-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and validate sale data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Require Naver Shopping secrets
        run: |
          if [ -z "${NAVER_CLIENT_ID}" ] || [ -z "${NAVER_CLIENT_SECRET}" ]; then
            echo "::error::NAVER_CLIENT_ID and NAVER_CLIENT_SECRET repository secrets are required."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Collect Naver Shopping candidates
        run: npm run price:collect-naver

      - name: Verify official product pages
        run: npm run links:probe-official -- --update-config

      - name: Build review proposal
        run: |
          npm run price:apply-live-offers
          npm run links:check
          npm run data:report
          npm run data:check
          npm run price:check-strict

      - name: Verify production build
        run: npm run build

      - name: Upload validated sale data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-sale-data-${{ github.run_id }}
          path: |
            data/price-candidates.naver.json
            data/data-quality-report.json
            data/purchase-link-live-report.json
            config/official-purchase-links.json
            src/data/items.json
          retention-days: 7

  publish:
    name: Commit validated sale data
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download validated sale data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-sale-data-${{ github.run_id }}
          path: validated

      - name: Apply validated sale data
        run: |
          cp validated/config/official-purchase-links.json config/official-purchase-links.json
          cp validated/data/data-quality-report.json data/data-quality-report.json
          cp validated/src/data/items.json src/data/items.json
          git diff --check

      - name: Commit and push changes
        run: |
          git add \
            config/official-purchase-links.json \
            data/data-quality-report.json \
            src/data/items.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh daily sale data"
          git push origin HEAD:main
