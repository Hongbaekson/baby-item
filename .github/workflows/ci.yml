name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check app data
        run: npm run data:check

      - name: Check published purchase links
        run: npm run links:check

      - name: Check strict price data readiness
        run: npm run price:check-strict

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check catalog deployment script
        run: sh -n scripts/deploy-daily-sale-data.sh

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser accessibility and responsive behavior
        run: npm run test:e2e

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build production container
        run: docker build --tag euni-baby-items:${GITHUB_SHA} .

      - name: Package build artifact
        run: |
          mkdir -p artifacts
          artifact="euni-baby-items-${GITHUB_SHA}.tar.gz"
          tar -C dist -czf "artifacts/${artifact}" .
          (
            cd artifacts
            sha256sum "${artifact}" > SHA256SUMS
          )
          cat artifacts/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: euni-baby-items-${{ github.sha }}
          path: |
            artifacts/euni-baby-items-${{ github.sha }}.tar.gz
            artifacts/SHA256SUMS
          retention-days: 14

  attest:
    name: Attest main artifact
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: euni-baby-items-${{ github.sha }}
          path: artifacts

      - name: Attest build artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: artifacts/SHA256SUMS
